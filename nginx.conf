server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Static marketing page + login SPA (multipage Vite build)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
